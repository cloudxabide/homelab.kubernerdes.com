# /opt/harbor/docker-compose.override.yml on nuc-00
#
# Pins Harbor's compose network (harbor_harbor) to 172.19.0.0/16. Docker would
# otherwise pick the next free 172.x range, and it picked 172.18.0.0/16, the
# prime AWS VPC: nuc-00 then treats the VPC as local and never routes it to
# ts-onprem (Tailscale).
#
# `docker compose` merges this file automatically, and Harbor's prepare /
# install.sh regenerates only docker-compose.yml, so this survives upgrades.
# Apply (Harbor is down briefly):
#   cd /opt/harbor && sudo docker compose down && sudo docker compose up -d
#   sudo docker network inspect harbor_harbor -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'   # 172.19.0.0/16
networks:
  harbor:
    ipam:
      config:
        - subnet: 172.19.0.0/16
