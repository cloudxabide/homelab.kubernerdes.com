# /etc/dhcpd.d/dhcpd-community.conf — community environment (10.10.14.0/24)
# Included by /etc/dhcpd.conf. Include only ONE environment file at a time:
# community and prime rebuild the same NUCs, so their MACs repeat in each file.

########## Harvester NUCs ##########
# Host: nuc-01 (gen10 NUC)
host nuc-01-community {
    hardware ethernet 88:ae:dd:0b:90:70;
    fixed-address 10.10.14.101;
    option host-name "nuc-01";
    option domain-name "community.kubernerdes.com";

    if exists user-class and option user-class = "iPXE" {
        # Second, process this file
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        # First boot using tftp, which is followed by line above
        filename "ipxe.efi";
    }
}
